<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#5d54d9">
    <title>You're offline — MyFakeBook</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; color: #202126; background: #f7f7f5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { max-width: 28rem; }
      .brand { color: #5d54d9; font-weight: 700; }
      h1 { font-size: 2rem; margin-block: 20px 12px; }
      p { line-height: 1.6; }
      a { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 8px; color: white; background: #5d54d9; text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) { :root { color: #f0f1f5; background: #111318; } .brand { color: #afa8ff; } }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">MyFakeBook</p>
      <h1>You're offline</h1>
      <p>Connect to the internet to open your library and work on your lead sheets.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
